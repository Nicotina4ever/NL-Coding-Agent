[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-coding-agent"
version = "0.1.0"
description = "NL Coding Agent - local-first multi-agent software development orchestrator"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "psutil",
    "crewai==1.15.32",
    "PyYAML",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
mcp = ["mcp>=1.30,<2", "jsonschema>=4.18"]
speech = ["faster-whisper>=1.2,<2", "vosk>=0.3.45,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nl_coding_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

name: Build NL Code artifacts

# Cross-platform verification and extension packaging are automatic.
# The Windows standalone carries an embedded Python engine and is built on a
# self-hosted Windows runner registered with the label `nlcode-windows`
# (Settings -> Actions -> Runners). macOS/Linux standalone packages are NOT
# produced here until a runner on that OS validates them; no placeholder binaries
# are published.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach artifacts to (empty = no release)"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp,test]"
      - name: Run portable engine regressions
        env:
          QT_QPA_PLATFORM: offscreen
        # Windows desktop/installer gates run locally or on the dedicated runner.
        run: >-
          python -m pytest -q --tb=short
          tests/test_access_mode.py tests/test_permissions.py
          tests/test_permissions_taxonomy.py tests/test_auto_review.py
          tests/test_session_runtime.py tests/test_chat_tools.py
          tests/test_mcp_sdk.py tests/test_mcp_integration.py
          tests/test_app_services_research.py tests/test_model_router.py
          tests/test_mission_project_binding.py

  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run test:webview
      - name: Package VSIX
        run: npx vsce package --out NL-Coder-${{ runner.os }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ runner.os }}
          path: frontend/NL-Coder-${{ runner.os }}.vsix

  windows-standalone:
    # The build needs the embedded Python runtime and a real desktop session for
    # the GUI acceptance; register a Windows runner with this label to enable it.
    if: vars.NLCODE_WINDOWS_RUNNER == 'true'
    runs-on: [self-hosted, Windows, X64, nlcode-windows]
    env:
      NLCODE_RELEASE_DIR: .workspace/build/ci-${{ github.run_id }}-${{ github.run_attempt }}/releases
      NLCODE_INSTALLER_TEST: .workspace/temp/c${{ github.run_number }}a${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }
      - name: Build standalone with embedded engine
        shell: pwsh
        run: ./scripts/nlcode/build_nl_code.ps1 -ResyncSource -Force
      - name: Package current extension
        run: npm --prefix frontend run package:vsix
      - name: Assemble release packages (portable ZIP + Inno installer)
        shell: pwsh
        run: ./scripts/nlcode/build_release.ps1 -Releases $env:NLCODE_RELEASE_DIR
      - name: Verify installer lifecycle on a custom path
        shell: pwsh
        run: ./scripts/nlcode/test_windows_installer.ps1 -Setup "$env:NLCODE_RELEASE_DIR/windows/NL-Code-Setup.exe" -Root $env:NLCODE_INSTALLER_TEST
      - name: GUI acceptance (terminals, Chat, embedded engine, shutdown)
        shell: pwsh
        run: ./scripts/nlcode/accept_nl_code.ps1 -ReplyTimeoutSeconds 60
      - uses: actions/upload-artifact@v4
        with:
          name: windows-standalone
          path: |
            ${{ env.NLCODE_RELEASE_DIR }}/windows/NL-Code-Portable.zip
            ${{ env.NLCODE_RELEASE_DIR }}/windows/NL-Code-Setup.exe
            ${{ env.NLCODE_RELEASE_DIR }}/windows/NL-Code-Portable.zip.sha256
            ${{ env.NLCODE_RELEASE_DIR }}/extension/NL-Coder.vsix
            ${{ env.NLCODE_RELEASE_DIR }}/release-manifest.json
            ${{ env.NLCODE_INSTALLER_TEST }}/verification.json

  publish:
    needs: [python-suite, extension]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vsix-*
      - name: Publish verified artifacts only
        if: vars.NLCODE_AUTO_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          prerelease: true
          files: artifacts/**/*.vsix
          fail_on_unmatched_files: true
